<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FONG 连麦</title>
<link rel="icon" type="image/svg+xml" href="fong-icon.svg">
<style>
*{box-sizing:border-box}
body{font:14px/1.6 system-ui,-apple-system,sans-serif;margin:0;padding:20px;background:#0B0C0E;color:#d7dae0}
h1{font-size:17px;margin:0 0 14px;font-weight:600}
.row{margin:9px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
input,button,select{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #2a2f3a;background:#171a21;color:#d7dae0}
button{cursor:pointer;background:#D7FF3A;border-color:#D7FF3A;color:#0B0C0E;font-weight:600}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:#3a4150;border-color:#3a4150}
label{display:flex;align-items:center;gap:5px;font-size:13px;color:#9aa3b2;white-space:nowrap}
input[type=checkbox]{width:15px;height:15px}
input[type=range]{padding:0;background:none;border:none;height:22px}
#log{white-space:pre-wrap;background:#0a0c10;border:1px solid #1e232d;border-radius:8px;padding:11px;height:160px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px}
audio{width:100%;margin-top:4px}
.remote{border-top:1px solid #1e232d;padding-top:6px;margin-top:6px}
.meterbox{position:relative;height:16px;background:#0a0c10;border:1px solid #1e232d;border-radius:4px;width:100%;max-width:460px;overflow:hidden}
#meter{height:100%;width:0;background:linear-gradient(90deg,#9fd62a,#D7FF3A 70%,#e8c33a);transition:width .05s linear}
#thrMark{position:absolute;top:0;bottom:0;width:2px;background:#e8543a}
#gateState{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:#3a4150}
#gateState.open{background:#D7FF3A;color:#0B0C0E}
#thrVal,#duckDbVal{font-variant-numeric:tabular-nums;min-width:44px;text-align:right;color:#e8c33a;font-size:12px}
.hint{font-size:12px;color:#5f6673;margin-top:10px;line-height:1.7}
.sec{margin-top:16px;font-size:12px;color:#5f6673;letter-spacing:.05em;text-transform:uppercase}
.duck{background:#151b28;border:1px solid #1e2b40;border-radius:8px;padding:10px 12px;margin-top:6px}
</style></head><body>
<h1 style="margin:0 0 14px"><img src="fong-wordmark-dark.svg" alt="FONG" style="height:30px;display:block"></h1>

<div class="row">房间 <input id="room" value="test" size="8">
 用户 <input id="peer" value="" size="8" placeholder="自动"></div>
<div class="row">
  <button id="join">加入</button>
  <button id="leave" class="ghost" disabled>离开</button>
  <button id="selfmute" class="ghost">静音自己</button>
</div>

<div class="sec">语音检测（Volume Gate）</div>
<div class="row">
  <label><input type="checkbox" id="gate" checked> 启用</label>
  <label>阈值 <input type="range" id="thr" min="-70" max="-10" value="-42" step="1">
    <span id="thrVal">-42 dB</span></label>
  <span id="gateState">未启动</span>
</div>
<div class="row"><div class="meterbox"><div id="meter"></div><div id="thrMark"></div></div></div>

<div class="sec">回声抑制（闪避 Ducking）</div>
<div class="duck">
  <div class="row">
    <label><input type="checkbox" id="duck" checked> 我说话时降低对方音量</label>
    <label>降低 <input type="range" id="duckDb" min="-30" max="0" value="-10" step="1">
      <span id="duckDbVal">-10 dB</span></label>
  </div>
  <div class="hint" style="margin-top:6px">
    这是 TS3 的「回声抑制[闪避]」。你一开口，对方音量自动压低 → 麦克风收到的回声变小 → 外放也不会啸叫。<br>
    比 AEC 温和：没有非线性伪影，音质不受损。
  </div>
</div>

<div class="sec">数字信号处理</div>
<div class="row">
  <label><input type="checkbox" id="aec"> 回声消除（AEC）</label>
  <label><input type="checkbox" id="ns" checked> 消除背景噪音</label>
  <label><input type="checkbox" id="agc" checked> 自动增益</label>
</div>
<div class="hint">
  <b>用耳机</b>：AEC 关。Chrome 的 AEC 有残留回声抑制器，会制造"混响"假象。<br>
  <b>用外放</b>：AEC 开 + 闪避开。
</div>

<div class="sec">音质</div>
<div class="row">
  <select id="quality">
    <option value="voice">语音 48k</option>
    <option value="high" selected>高音质 96k</option>
    <option value="ultra">极高 128k</option>
    <option value="music">音乐 256k</option>
    <option value="max">极限 320k</option>
  </select>
</div>

<div id="remotes"></div>
<div id="log"></div>
<script src="app.js"></script>
</body></html>
