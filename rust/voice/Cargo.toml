[package]
name = "fong-voice"
version = "0.1.0"
edition = "2021"
description = "FONG native voice engine: capture -> APM -> denoise -> Opus -> WebRTC"

[lib]
name = "fong_voice"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "fong-voice-cli"
path = "src/bin/cli.rs"

[dependencies]
fong-dsp = { path = "../dsp" }
cpal = "0.15"
webrtc = "0.11"
opus1 = "0.3"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
